name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Restore
        run: dotnet restore src/Tradeflow.Api/Tradeflow.Api.csproj
      - name: Build
        run: dotnet build --no-restore src/Tradeflow.Api/Tradeflow.Api.csproj
      - name: Frontend Install
        run: |
          cd frontend
          npm install
      - name: Frontend Build
        run: |
          cd frontend
          npm run build
